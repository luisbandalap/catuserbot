name: build-docker-image

on:
  push:
    branches:
      - "**"
  schedule:
    - cron: "0 8 1/7 * *"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOCKERIO_TAG: "docker.io/luisbandalap/catuserbot"
      GIT_NUBECITA_TAG: "git.nubecita.biz/luisbandalap/catuserbot"
      LABEL_AUTHOR: "luisbandalap <luis449bp+tgbot@gmail.com>"
      LABEL_DESCRIPTION: "CatUserBot: A simple Telegram userbot based on Telethon. UNOFFICAL docker image"
      LABEL_VENDOR: "luisbandalap"
      LABEL_SOURCE_URL: "https://github.com/luisbandalap/catuserbot"
      LABEL_TITLE: "CatUserBot (UNOFFICIAL)"
      BUILD_UPSTREAM_REPO: ${{ github.repository }}

    steps:
      - name: Set environment (dynamic values)
        run: |
          echo "IMAGE_DATE_TAG=`date -u +"%Y%m%d"`" >> $GITHUB_ENV
          echo "LABEL_CREATE_DATE=`date -u +"%Y-%m-%dT%H:%M:%SZ"`" >> $GITHUB_ENV
          echo "BUILD_UPSTREAM_REPO_BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

      - name: Checkout the repo
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry (docker.io)
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: luisbandalap
          password: ${{ secrets.DOCKERIO_SECRET_LUISBANDALAP }}

      - name: Login to Container Registry (git.nubecita.biz)
        uses: docker/login-action@v3
        with:
          registry: git.nubecita.biz
          username: luisbandalap
          password: ${{ secrets.GITNUBECITA_SECRET_REGISTRY_PACKAGES }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_UPSTREAM_REPO=${{ env.BUILD_UPSTREAM_REPO }}
            BUILD_UPSTREAM_REPO_BRANCH=${{ env.BUILD_UPSTREAM_REPO_BRANCH }}
          tags: |
            ${{ env.GIT_NUBECITA_TAG }}:latest
            ${{ env.GIT_NUBECITA_TAG }}:latest-${{ env.BUILD_UPSTREAM_REPO_BRANCH }}
            ${{ env.GIT_NUBECITA_TAG }}:${{ env.BUILD_UPSTREAM_REPO_BRANCH }}-${{ env.IMAGE_DATE_TAG }}
            ${{ env.DOCKERIO_TAG }}:latest
            ${{ env.DOCKERIO_TAG }}:latest-${{ env.BUILD_UPSTREAM_REPO_BRANCH }}
            ${{ env.DOCKERIO_TAG }}:${{ env.BUILD_UPSTREAM_REPO_BRANCH }}-${{ env.IMAGE_DATE_TAG }}
          labels: |
            org.opencontainers.image.created=${{ env.LABEL_CREATE_DATE }}
            org.opencontainers.image.authors=${{ env.LABEL_AUTHOR }}
            org.opencontainers.image.description=${{ env.LABEL_DESCRIPTION }}
            org.opencontainers.image.vendor=${{ env.LABEL_VENDOR }}
            org.opencontainers.image.source=${{ env.LABEL_SOURCE_URL }}
            org.opencontainers.image.title=${{ env.LABEL_TITLE }}
          outputs: type=image,push-by-digest=false,name-canonical=true,push=true
